[project]
name = "led-controller"
version = "1.0.0"
description = "LED strip controller GUI (Windows / Linux) with serial debug console"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.5", "pyserial>=3.5"]

[project.scripts]
led-controller = "ledcontroller.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ledcontroller*"]

[tool.setuptools.package-data]
ledcontroller = ["ui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
